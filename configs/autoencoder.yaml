# Autoencoder Configuration
# Fully-connected Autoencoder for anomaly detection

experiment:
  name: "autoencoder"
  seed: 42
  device: "auto"  # auto | cpu | cuda

data:
  dataset: "FD001"
  data_dir: "data/raw"
  output_dir: "data/processed"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_strategy: "engine_level"
  normalization: "standard"

features:
  selected_sensors: null
  include_operational_settings: true

model:
  type: "autoencoder"
  # Encoder architecture: input_dim -> layers -> latent_dim
  encoder_layers: [64, 32]
  latent_dim: 16
  # Decoder mirrors encoder
  decoder_layers: [32, 64]
  activation: "relu"  # relu | leaky_relu | tanh
  dropout: 0.2
  batch_norm: true

training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # adam | adamw
  scheduler:
    type: "reduce_on_plateau"  # reduce_on_plateau | cosine | step | none
    patience: 10
    factor: 0.5
  early_stopping:
    patience: 15
    min_delta: 0.0001
    monitor: "val_loss"
  loss: "mse"  # mse | mae
  # Train on normal data only (early engine life)
  normal_ratio: 0.7  # Use first 70% of each engine's life as "normal"

anomaly_scoring:
  method: "mse"  # mse | mae | feature_wise_mse
  aggregate: "mean"  # mean | max | sum

threshold:
  strategy: "validation_percentile"
  percentile: 95

evaluation:
  metrics:
    - precision
    - recall
    - f1
    - pr_auc
    - roc_auc
    - false_positive_rate
    - detection_lead_time
    - mean_detection_delay
  early_warning:
    persistence_window: 5
    min_lead_time: 10

output:
  results_dir: "results"
  save_model: true
  model_dir: "experiments"
  experiment_id: null
